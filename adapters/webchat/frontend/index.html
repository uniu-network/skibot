<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WebChat</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="header">
    <h1>WebChat</h1>
    <div class="header-actions">
        <button id="file-btn" class="icon-btn" title="Send image/file">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
        </button>
        <input type="file" id="file-input" accept="image/*,audio/*" style="display:none">
        <div id="status" class="status disconnected" title="Disconnected"></div>
    </div>
</div>
<div id="chat-container"></div>
<div id="image-preview" class="image-preview hidden">
    <img id="preview-img" src="" alt="Preview">
    <span id="preview-close" class="preview-close">&times;</span>
</div>
<div id="upload-preview" class="upload-preview hidden">
    <span class="upload-preview-name"></span>
    <button id="cancel-upload" class="cancel-upload">&times;</button>
</div>
<div class="input-area">
    <textarea id="msg-input" rows="1" placeholder="Type a message... (paste image URL to send image)" disabled></textarea>
    <button id="send-btn" disabled>Send</button>
</div>
<script src="/app.js"></script>
</body>
</html>
